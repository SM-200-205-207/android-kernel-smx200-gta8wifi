name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - android-14

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-14

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 python3 zip cpio \
            gcc-aarch64-linux-gnu libncurses5 libtinfo5 libyaml-dev pkg-config

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain/clang toolchain/gcc
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r3/clang-r383902.tar.gz" | tar -xz -C toolchain/clang
          curl -sSL "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/android-11.0.0_r3.tar.gz" | tar -xz -C toolchain/gcc

      - name: Build Kernel Image
        run: |
          export PATH="$PWD/toolchain/clang/bin:$PWD/toolchain/gcc/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export BSP_BUILD_FAMILY=sharkl5Pro
          export BSP_BUILD_ANDROID_OS=y
          export KCFLAGS="-Wno-error"
          export HOST_LOADLIBES="-lyaml"

          chmod +x tools/mkdtimg/* 2>/dev/null || true

          make O=out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- gta8wifi_eur_open_defconfig
          make -j$(nproc) O=out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- HOST_LOADLIBES="-lyaml" Image dtbs

          # Package DTB and DTBO images for AOSP/LineageOS
          cp out/arch/arm64/boot/dts/sprd/ums512.dtb out/dtb.img
          ./tools/mkdtimg/mkdtimg create out/dtbo.img --page_size=2048 \
            --id=0x1100 out/arch/arm64/boot/dts/sprd/ums512-1h10-overlay.dtbo \
            --id=0x1900 out/arch/arm64/boot/dts/sprd/ums512-1h10_go-overlay.dtbo \
            --id=0x1100 out/arch/arm64/boot/dts/sprd/ums512-25c10-overlay.dtbo \
            --id=0x2100 out/arch/arm64/boot/dts/sprd/ums512-2h10-overlay.dtbo \
            --id=0x1100 out/arch/arm64/boot/dts/sprd/ums512-wifionly-overlay.dtbo

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

          # Configure anykernel.sh for Samsung Galaxy Tab A8 Wi-Fi (SM-X200)
          sed -i 's/kernel.string=.*/kernel.string=LineageOS Kernel for Samsung Galaxy Tab A8 (gta8wifi)/' anykernel/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=gta8wifi/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=SM-X200/' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=gta8/' anykernel/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=ums512/' anykernel/anykernel.sh
          sed -i 's/device.name5=.*/device.name5=/' anykernel/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;\nblock=/dev/block/by-name/boot;|' anykernel/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;\nis_slot_device=0;|' anykernel/anykernel.sh
          sed -i 's|^RAMDISK_COMPRESSION=.*|RAMDISK_COMPRESSION=auto;\nramdisk_compression=auto;|' anykernel/anykernel.sh

          # Remove sample/tuna-specific modifications from template
          sed -i '/# init.rc/,/append_file fstab.tuna/d' anykernel/anykernel.sh

          # Ensure dtbo partition flashing is handled
          sed -i 's|^write_boot;.*|write_boot;\n\n# Flash DTBO partition\nflash_generic dtbo;|' anykernel/anykernel.sh

          # Copy kernel image, dtb, and dtbo
          cp out/arch/arm64/boot/Image anykernel/Image
          cp out/dtb.img anykernel/dtb
          cp out/dtbo.img anykernel/dtbo.img

          # Package flashable zip
          cd anykernel
          zip -r9 ../AnyKernel3-gta8wifi-${{ github.run_number }}.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: out/arch/arm64/boot/Image

      - name: Upload DTB and DTBO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb-dtbo
          path: |
            out/dtb.img
            out/dtbo.img

      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-gta8wifi-${{ github.run_number }}
          path: AnyKernel3-gta8wifi-${{ github.run_number }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: kernel-build-${{ github.run_number }}
          name: "Kernel Build #${{ github.run_number }}"
          files: |
            out/arch/arm64/boot/Image
            out/dtb.img
            out/dtbo.img
            AnyKernel3-gta8wifi-${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
